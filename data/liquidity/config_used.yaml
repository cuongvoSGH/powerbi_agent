scenarios:
  ACT:
    name: Actual
    type: actual
    order: 0
    description: Historical actuals (no projection).
  BASE:
    name: Baseline
    type: baseline
    order: 1
    description: 'Business-as-usual funding plan: normal rollover, modest deposit
      growth.'
  IDIO:
    name: Idiosyncratic
    type: stress
    order: 2
    description: 'Name-specific: 3-notch downgrade, retail and corporate deposit withdrawals,
      wholesale non-renewal, collateral calls.'
  MARKET:
    name: Market-wide
    type: stress
    order: 3
    description: 'System-wide: HQLA price falls, unsecured interbank market closed,
      USD/GBP funding stress, facilities drawn.'
  COMBINED:
    name: Combined severe
    type: stress
    order: 4
    description: Severe but plausible combination of idiosyncratic and market-wide
      shocks (EBA GL/2018/04 para 124).
  EXTREME:
    name: Extreme
    type: stress
    order: 5
    description: 'Extreme digital-run style shock (LiST 2019 ''extreme'' analogue):
      fast retail and corporate outflows, full wholesale run.'
  REVERSE:
    name: Reverse stress
    type: reverse
    order: 6
    based_on: COMBINED
    target_survival_days: 30
    description: COMBINED shock scaled until the bank survives the target number of
      days (pre management actions).
